# ==============================================================================
# StudySync AI — Fly.io Deployment Configuration
#
# Free-Tier Highlights:
# - Up to 3 shared-cpu-1x 256MB VMs free
# - 3GB persistent NVMe volume storage free (preserves SQLite database across redeploys)
# - Automatic global HTTPS termination & custom domains
# ==============================================================================

app = "studysync-ai"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  HOST = "0.0.0.0"
  DATABASE_PATH = "/data/studysync.db"
  SERVE_STATIC = "true"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[mounts]
  source = "studysync_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
