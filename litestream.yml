# ==============================================================================
# StudySync AI — Litestream Configuration for Backblaze B2
#
# Free Backblaze B2 Object Storage (S3-Compatible):
# - 10GB persistent storage free forever
# - No credit card required
# - Replicates SQLite WAL commits in real-time
# ==============================================================================

dbs:
  - path: "${DATABASE_PATH}"
    replicas:
      - type: s3
        bucket: "${B2_BUCKET}"
        path: "studysync-db"
        endpoint: "${B2_ENDPOINT}"
        region: "${B2_REGION}"
        access-key-id: "${B2_KEY_ID}"
        secret-access-key: "${B2_APPLICATION_KEY}"
        force-path-style: true
        sync-interval: 1s


