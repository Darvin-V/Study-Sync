# ==============================================================================
# StudySync AI — Render Blueprint Configuration
#
# Free Tier Docker Web Service with Litestream & Backblaze B2 Persistence
# ==============================================================================

services:
  - type: web
    name: studysync-ai
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_STATIC
        value: "true"
      - key: DATABASE_PATH
        value: /data/studysync.db
      - key: CORS_ORIGIN
        value: https://studysync-ai.onrender.com
      # Zero-Cost Email OTP (Resend Free Tier: 3,000 emails/month)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: StudySync AI <onboarding@resend.dev>
      # Zero-Cost SQLite Persistence (Backblaze B2 Free 10GB Bucket)
      - key: B2_BUCKET
        value: StudySync
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_ENDPOINT
        value: https://s3.us-east-005.backblazeb2.com
      - key: B2_REGION
        value: us-east-005
